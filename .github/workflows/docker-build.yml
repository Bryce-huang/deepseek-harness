name: Build and Push Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: brycehuang/deepseek-harness

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute unique version tag
        id: version
        run: |
          # Date (UTC) + short commit SHA = unique per build, human-readable
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Unique build tag: ${DATE}-${SHORT_SHA}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=build-latest
          cache-to: type=gha,mode=max,scope=build-latest

  # Post-push verification on the published image: boot the container, walk
  # the sign-in flow end to end, and check the installed toolchain.
  smoke:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull the published image
        run: docker pull ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}

      - name: Start container
        run: |
          docker run -d --name dsh-smoke -p 8080:8080 \
            ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          echo "first response: $code"

      - name: Verify sign-in flow
        run: |
          set -eu
          IMAGE=${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}
          # Browser navigation gets the HTML sign-in page on 401.
          curl -s -H 'Accept: text/html' http://localhost:8080/ | grep -q 'name="token"' \
            || { echo 'sign-in page missing token form'; exit 1; }
          # API clients keep the machine-readable body.
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 401 ]
          # Launch-token exchange mints the cookie; the cookie then authorizes.
          TOKEN=$(docker logs dsh-smoke 2>&1 | grep -oE 'token=[A-Za-z0-9_-]+' | head -1 | cut -d= -f2)
          [ -n "$TOKEN" ] || { echo 'no launch token in logs'; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/?token=$TOKEN")" = 303 ]
          curl -s -c /tmp/dsh-cookies.txt -o /dev/null "http://localhost:8080/?token=$TOKEN"
          [ "$(curl -s -b /tmp/dsh-cookies.txt -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200 ]
          # The container runs as the app user 6001:6000.
          [ "$(docker exec dsh-smoke id -u)" = 6001 ]
          [ "$(docker exec dsh-smoke id -g)" = 6000 ]
          echo 'sign-in flow OK'

      - name: Verify toolchain
        run: |
          set -eu
          docker exec dsh-smoke sh -c 'go version && java -version 2>&1 | head -1 && python3 --version && node --version && git --version && pnpm --version'

      - name: Teardown
        if: always()
        run: docker rm -f dsh-smoke
