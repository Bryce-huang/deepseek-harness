# Build and push the dsh web container image (Dockerfile at the repository
# root). Every master push publishes a latest + sha-<short> pair; a v* or
# dsh-v* tag additionally publishes the tag name. GHCR authentication uses
# the built-in GITHUB_TOKEN, so no registry secrets are required.
name: Docker image

on:
  push:
    branches: [master]
    tags: ['v*', 'dsh-v*']

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push amd64 image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase repository names; GitHub allows mixed case.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest
        run: echo "Pushed ${{ steps.image.outputs.name }} with tags: ${{ steps.meta.outputs.tags }}"
