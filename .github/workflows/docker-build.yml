name: Build and Push Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: brycehuang/deepseek-harness

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Two variants of the runtime base: the pinned sandbox release (default
    # `latest` image tags) and the tracking sandbox `latest` release
    # (`sandbox-latest` suffixed tags). Each variant keeps its own unique
    # date+SHA tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: ghcr.io/agent-infra/sandbox:1.11.0
            suffix: ''
            alias: latest
          - base: ghcr.io/agent-infra/sandbox:latest
            suffix: '-sandbox-latest'
            alias: sandbox-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute unique version tag
        id: version
        run: |
          # Date (UTC) + short commit SHA = unique per build, human-readable
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=${DATE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Unique build tag: ${DATE}-${SHORT_SHA}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}${{ matrix.suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.alias }}
          build-args: |
            SANDBOX_IMAGE=${{ matrix.base }}
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=build-${{ matrix.alias }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.alias }}
